<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">

  <title>Đồng hồ</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    #clock {
      width: 100%;
      text-align: center;
      color: white;
      font-weight: 700;
      font-size: clamp(45px, 15vw, 120px);
      letter-spacing: 2px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (max-width: 400px) {
      #clock {
        font-size: 15vw;
        letter-spacing: 1px;
      }
    }

    @media (orientation: landscape) {
      #clock {
        font-size: clamp(50px, 18vh, 130px);
      }
    }
  </style>
</head>

<body>

  <div id="clock">23:00:00</div>

  <script>
    let totalSeconds = 23 * 60 * 60;

    const clock = document.getElementById("clock");

    function updateClock() {
      const hours = Math.floor(totalSeconds / 3600) % 24;
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const h = String(hours).padStart(2, "0");
      const m = String(minutes).padStart(2, "0");
      const s = String(seconds).padStart(2, "0");

      clock.textContent = `${h}:${m}:${s}`;

      // Khi tới 00:00:00
      if (totalSeconds >= 24 * 60 * 60) {
        clock.textContent = "00:00:00";

        clearInterval(timer);

        // Sau 500ms chuyển sang thoinen.html
        setTimeout(function() {
          window.location.href = "thoinen.html";
        }, 500);

        return;
      }

      totalSeconds++;
    }

    updateClock();

    // Tốc độ chạy
    const timer = setInterval(updateClock, 10);
  </script>

</body>
</html>
