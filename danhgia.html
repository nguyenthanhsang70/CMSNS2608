<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta name="theme-color" content="#f8eaf2">

    <title>Đánh giá của em</title>

    <style>
        /* ==============================
           RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            -webkit-text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Inter,
                Roboto,
                Arial,
                sans-serif;

            color: #2f2930;

            background:
                linear-gradient(
                    135deg,
                    #fff6f9 0%,
                    #fce8f1 30%,
                    #f0e7fb 65%,
                    #e9f2ff 100%
                );

            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        button {
            font: inherit;
            appearance: none;
            -webkit-appearance: none;

            border: 0;
            outline: none;

            user-select: none;
            -webkit-user-select: none;

            touch-action: manipulation;
        }


        /* ==============================
           BACKGROUND
        ============================== */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;
            pointer-events: none;

            z-index: 0;
        }

        .glow {
            position: absolute;

            border-radius: 999px;

            filter: blur(15px);

            opacity: 0.55;

            will-change: transform;

            animation:
                floatingGlow
                11s
                ease-in-out
                infinite
                alternate;
        }

        .glow-1 {
            width: 420px;
            height: 420px;

            top: -190px;
            left: -160px;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 132, 178, 0.85),
                    rgba(255, 193, 218, 0.15) 70%
                );
        }

        .glow-2 {
            width: 480px;
            height: 480px;

            right: -210px;
            bottom: -230px;

            background:
                radial-gradient(
                    circle,
                    rgba(181, 152, 255, 0.70),
                    rgba(216, 202, 255, 0.10) 70%
                );

            animation-delay: -4s;
        }

        .glow-3 {
            width: 280px;
            height: 280px;

            top: 40%;
            left: 54%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 183, 210, 0.58),
                    rgba(255, 222, 234, 0.05) 70%
                );

            animation-delay: -7s;
        }

        @keyframes floatingGlow {
            from {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            to {
                transform:
                    translate3d(30px, -25px, 0)
                    scale(1.12);
            }
        }


        /* ==============================
           DECORATIVE DOTS
        ============================== */

        .dot-grid {
            position: absolute;

            width: 190px;
            height: 190px;

            opacity: 0.16;

            background-image:
                radial-gradient(
                    rgba(120, 72, 103, 0.55) 1px,
                    transparent 1px
                );

            background-size: 17px 17px;
        }

        .grid-1 {
            top: 8%;
            right: 5%;

            transform: rotate(8deg);
        }

        .grid-2 {
            left: 3%;
            bottom: 5%;

            transform: rotate(-9deg);
        }


        /* ==============================
           PAGE
        ============================== */

        .page {
            position: relative;

            z-index: 5;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
        }


        /* ==============================
           MAIN CARD
        ============================== */

        .card {
            position: relative;

            width: min(100%, 520px);

            padding:
                52px
                34px
                31px;

            text-align: center;

            border-radius: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.78),
                    rgba(255, 255, 255, 0.52)
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.95);

            box-shadow:
                0 40px 100px
                rgba(95, 62, 86, 0.15),

                0 8px 25px
                rgba(123, 87, 110, 0.07),

                inset 0 1px 0
                rgba(255, 255, 255, 0.9);

            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            overflow: hidden;

            animation:
                showCard
                0.7s
                cubic-bezier(.2,.8,.2,1);
        }

        .card::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            left: -100px;
            top: -120px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.9),
                    rgba(255, 255, 255, 0)
                );

            pointer-events: none;
        }

        .card::after {
            content: "";

            position: absolute;

            left: 50%;
            top: 0;

            width: 58%;
            height: 1px;

            transform: translateX(-50%);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,1),
                    transparent
                );
        }

        @keyframes showCard {
            from {
                opacity: 0;

                transform:
                    translateY(28px)
                    scale(0.96);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* ==============================
           LABEL
        ============================== */

        .label-wrap {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding:
                8px
                14px;

            margin-bottom: 18px;

            border-radius: 999px;

            background:
                rgba(255, 255, 255, 0.55);

            border:
                1px solid
                rgba(255, 255, 255, 0.85);

            box-shadow:
                0 8px 22px
                rgba(100, 70, 90, 0.07);
        }

        .label {
            color: #ae637f;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 2.2px;
            text-transform: uppercase;
        }


        /* ==============================
           TITLE
        ============================== */

        h1 {
            position: relative;

            z-index: 2;

            max-width: 420px;

            margin: 0 auto;

            color: #332b31;

            font-size:
                clamp(
                    30px,
                    7vw,
                    43px
                );

            font-weight: 780;

            line-height: 1.15;

            letter-spacing: -1.5px;
        }

        .accent-line {
            width: 48px;
            height: 4px;

            margin:
                20px
                auto
                0;

            border-radius: 999px;

            background:
                linear-gradient(
                    90deg,
                    #ff6697,
                    #d08cff
                );

            box-shadow:
                0 4px 14px
                rgba(255, 102, 151, 0.25);
        }


        /* ==============================
           BUTTON AREA
        ============================== */

        .button-area {
            position: relative;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            gap: 13px;

            min-height: 100px;

            margin-top: 34px;
        }

        .btn {
            position: relative;

            min-width: 145px;
            min-height: 54px;

            padding:
                14px
                22px;

            border-radius: 18px;

            font-size: 15px;
            font-weight: 720;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

            white-space: nowrap;
        }


        /* ==============================
           YES BUTTON
        ============================== */

        #yesBtn {
            overflow: hidden;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #ff5f92,
                    #f276a5 55%,
                    #df7dc7
                );

            box-shadow:
                0 15px 34px
                rgba(235, 91, 143, 0.30),

                inset 0 1px 0
                rgba(255, 255, 255, 0.27);
        }

        #yesBtn::before {
            content: "";

            position: absolute;

            top: -70%;
            left: -70%;

            width: 45%;
            height: 240%;

            transform:
                rotate(25deg);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.48),
                    transparent
                );

            transition:
                left 0.7s ease;
        }

        #yesBtn:active {
            transform: scale(0.96);
        }


        /* ==============================
           NO BUTTON
        ============================== */

        #noBtn {
            color: #655a63;

            background:
                rgba(255,255,255,0.74);

            border:
                1px solid
                rgba(255,255,255,0.95);

            box-shadow:
                0 13px 29px
                rgba(74, 58, 70, 0.09),

                inset 0 1px 0
                rgba(255,255,255,0.8);

            z-index: 8000;
        }


        /* ==============================
           HINT
        ============================== */

        .hint {
            margin-top: 0;

            color: #9e919a;

            font-size: 12px;

            letter-spacing: 0.3px;
        }


        /* ==============================
           DESKTOP HOVER
        ============================== */

        @media
        (hover: hover)
        and
        (pointer: fine) {

            #yesBtn:hover {
                transform:
                    translateY(-4px);

                box-shadow:
                    0 20px 42px
                    rgba(235, 91, 143, 0.38);
            }

            #yesBtn:hover::before {
                left: 145%;
            }
        }


        /* ==============================
           POPUP OVERLAY
        ============================== */

        .modal-overlay {
            position: fixed;
            inset: 0;

            z-index: 20000;

            display: none;
            align-items: center;
            justify-content: center;

            padding:
                max(18px, env(safe-area-inset-top))
                max(18px, env(safe-area-inset-right))
                max(18px, env(safe-area-inset-bottom))
                max(18px, env(safe-area-inset-left));

            background:
                rgba(18, 17, 24, 0.48);

            backdrop-filter: blur(17px);
            -webkit-backdrop-filter: blur(17px);

            animation:
                fadeOverlay
                0.25s
                ease;
        }

        @keyframes fadeOverlay {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* ==============================
           MODAL
        ============================== */

        .modal {
            position: relative;

            width: min(100%, 450px);

            overflow: hidden;

            border-radius: 29px;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    #242836 0%,
                    #171b26 60%,
                    #141722 100%
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            box-shadow:
                0 45px 120px
                rgba(0, 0, 0, 0.47),

                inset 0 1px 0
                rgba(255,255,255,0.04);

            animation:
                showModal
                0.42s
                cubic-bezier(.2,.85,.3,1.1);
        }

        .modal::before {
            content: "";

            position: absolute;

            width: 250px;
            height: 180px;

            top: -110px;
            left: 50%;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 103, 155, 0.20),
                    transparent 68%
                );

            pointer-events: none;
        }

        @keyframes showModal {
            from {
                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.94);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* ==============================
           MODAL HEADER
        ============================== */

        .modal-header {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 72px;

            padding:
                17px
                18px
                17px
                23px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.065);
        }

        .modal-title-small {
            display: flex;
            align-items: center;

            gap: 11px;

            color: #d6dae6;

            font-size: 14px;
            font-weight: 680;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ff719f,
                    #ec75bb
                );

            box-shadow:
                0 0 0 5px
                rgba(255, 113, 159, 0.10),

                0 0 20px
                rgba(255, 113, 159, 0.28);
        }

        .close-btn {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 14px;

            color: #e1e5ee;

            background:
                rgba(255,255,255,0.055);

            font-size: 24px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .close-btn:active {
            transform: scale(0.94);

            background:
                rgba(255,255,255,0.10);
        }


        /* ==============================
           MODAL BODY
        ============================== */

        .modal-body {
            position: relative;

            padding:
                38px
                27px
                29px;

            text-align: center;
        }

        .modal-body h2 {
            margin-bottom: 13px;

            color: #ffffff;

            font-size:
                clamp(
                    25px,
                    7vw,
                    30px
                );

            font-weight: 750;

            letter-spacing: -0.8px;
        }

        .modal-message {
            max-width: 330px;

            margin:
                0
                auto
                30px;

            color: #adb4c4;

            font-size: 15px;

            line-height: 1.7;
        }

        .modal-message strong {
            color: #ff8caf;

            font-weight: 700;
        }


        /* ==============================
           COUNTDOWN
        ============================== */

        .countdown-card {
            padding:
                17px
                17px
                15px;

            border-radius: 20px;

            text-align: left;

            background:
                rgba(255,255,255,0.047);

            border:
                1px solid
                rgba(255,255,255,0.065);
        }

        .countdown-top {
            display: flex;
            align-items: center;

            gap: 14px;
        }

        .countdown-number {
            width: 48px;
            height: 48px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            color: white;

            font-size: 20px;
            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #ff5f92,
                    #e779bf
                );

            box-shadow:
                0 10px 24px
                rgba(237, 89, 148, 0.22);
        }

        .countdown-info {
            min-width: 0;
        }

        .countdown-title {
            margin-bottom: 4px;

            color: #edf0f5;

            font-size: 14px;
            font-weight: 670;
        }

        .countdown-text {
            color: #7f8799;

            font-size: 12px;

            line-height: 1.4;
        }


        /* ==============================
           PROGRESS
        ============================== */

        .progress-track {
            width: 100%;
            height: 4px;

            margin-top: 15px;

            overflow: hidden;

            border-radius: 999px;

            background:
                rgba(255,255,255,0.07);
        }

        .progress-bar {
            width: 100%;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #ff6598,
                    #e27fca
                );

            transform-origin: left center;

            animation:
                countdownProgress
                5s
                linear
                forwards;
        }

        @keyframes countdownProgress {
            from {
                transform: scaleX(1);
            }

            to {
                transform: scaleX(0);
            }
        }


        /* ==============================
           SMALL PHONE
        ============================== */

        @media (max-width: 390px) {

            .page {
                padding:
                    max(14px, env(safe-area-inset-top))
                    max(14px, env(safe-area-inset-right))
                    max(14px, env(safe-area-inset-bottom))
                    max(14px, env(safe-area-inset-left));
            }

            .card {
                padding:
                    43px
                    18px
                    26px;

                border-radius: 28px;
            }

            .label-wrap {
                margin-bottom: 15px;
            }

            h1 {
                font-size: 29px;
            }

            .button-area {
                gap: 9px;

                margin-top: 29px;

                min-height: 92px;
            }

            .btn {
                min-width: 122px;
                min-height: 50px;

                padding:
                    13px
                    14px;

                font-size: 14px;

                border-radius: 16px;
            }

            .modal-body {
                padding:
                    32px
                    19px
                    23px;
            }

        }


        /* ==============================
           PHONE LANDSCAPE
        ============================== */

        @media
        (max-height: 520px)
        and
        (orientation: landscape) {

            .card {
                max-width: 520px;

                padding:
                    25px
                    30px
                    18px;
            }

            .label-wrap {
                margin-bottom: 10px;
            }

            h1 {
                font-size: 30px;
            }

            .accent-line {
                margin-top: 13px;
            }

            .button-area {
                margin-top: 18px;

                min-height: 65px;
            }

            .hint {
                display: none;
            }

            .modal {
                max-height:
                    calc(
                        100dvh - 20px
                    );

                overflow-y: auto;
            }

            .modal-header {
                min-height: 60px;
            }

            .modal-body {
                padding:
                    21px
                    25px
                    20px;
            }

            .modal-message {
                margin-bottom: 18px;
            }

        }


        /* ==============================
           REDUCED MOTION
        ============================== */

        @media
        (prefers-reduced-motion: reduce) {

            .glow {
                animation: none;
            }

            .card,
            .modal,
            .modal-overlay {
                animation-duration: 0.01ms;
            }

        }

    </style>
</head>


<body>


    <!-- BACKGROUND -->

    <div class="background">

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
        <div class="glow glow-3"></div>

        <div class="dot-grid grid-1"></div>
        <div class="dot-grid grid-2"></div>

    </div>



    <!-- MAIN PAGE -->

    <div class="page">

        <main class="card">

            <div class="label-wrap">

                <span class="label">
                    Đánh giá của em
                </span>

            </div>


            <h1>
                Em có thích không?
            </h1>


            <div class="accent-line"></div>


            <div class="button-area">

                <button
                    type="button"
                    class="btn"
                    id="yesBtn"
                >
                    Có, em thích
                </button>


                <button
                    type="button"
                    class="btn"
                    id="noBtn"
                >
                    Không
                </button>

            </div>


            <p class="hint">
                Chọn cẩn thận nha
            </p>

        </main>

    </div>



    <!-- POPUP -->

    <div
        class="modal-overlay"
        id="modalOverlay"
    >

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >


            <div class="modal-header">

                <div class="modal-title-small">

                    <span class="status-dot"></span>

                    <span>Thông báo</span>

                </div>


                <button
                    type="button"
                    class="close-btn"
                    id="closeModal"
                    aria-label="Đóng"
                >
                    ×
                </button>

            </div>



            <div class="modal-body">


                <h2 id="modalTitle">
                    Anh biết mà!
                </h2>


                <p class="modal-message">

                    Hãy nhắn tin cho
                    <strong>anh</strong>
                    nhá.

                    <br>

                    Anh đang đợi tin nhắn
                    của em đó.

                </p>



                <div class="countdown-card">

                    <div class="countdown-top">

                        <div
                            class="countdown-number"
                            id="seconds"
                        >
                            5
                        </div>


                        <div class="countdown-info">

                            <div class="countdown-title">
                                Đang chuyển trang...
                            </div>

                            <div class="countdown-text">
                                Bạn sẽ được chuyển sang
                                trang tiếp theo.
                            </div>

                        </div>

                    </div>


                    <div class="progress-track">

                        <div
                            class="progress-bar"
                            id="progressBar"
                        ></div>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <script>

        const yesBtn =
            document.getElementById("yesBtn");

        const noBtn =
            document.getElementById("noBtn");

        const modalOverlay =
            document.getElementById("modalOverlay");

        const closeModal =
            document.getElementById("closeModal");

        const secondsElement =
            document.getElementById("seconds");

        const progressBar =
            document.getElementById("progressBar");


        let countdownInterval = null;
        let redirectTimeout = null;
        let popupStarted = false;

        let lastMoveTime = 0;



        /* =================================
           VIEWPORT
        ================================= */

        function getViewport() {

            if (window.visualViewport) {

                return {
                    width:
                        window.visualViewport.width,

                    height:
                        window.visualViewport.height,

                    offsetLeft:
                        window.visualViewport.offsetLeft,

                    offsetTop:
                        window.visualViewport.offsetTop
                };

            }


            return {
                width: window.innerWidth,
                height: window.innerHeight,
                offsetLeft: 0,
                offsetTop: 0
            };

        }



        /* =================================
           RANDOM POSITION
        ================================= */

        function getSafeRandomPosition() {

            const viewport =
                getViewport();

            const rect =
                noBtn.getBoundingClientRect();

            /*
             * Khoảng cách an toàn
             * để nút không biến mất
             * khỏi màn hình.
             */

            const edge = 28;


            const minX =
                viewport.offsetLeft +
                edge;

            const minY =
                viewport.offsetTop +
                edge;


            const maxX =
                viewport.offsetLeft +
                viewport.width -
                rect.width -
                edge;

            const maxY =
                viewport.offsetTop +
                viewport.height -
                rect.height -
                edge;


            let x;
            let y;

            let attempts = 0;


            do {

                x =
                    minX +
                    Math.random() *
                    Math.max(
                        0,
                        maxX - minX
                    );


                y =
                    minY +
                    Math.random() *
                    Math.max(
                        0,
                        maxY - minY
                    );


                attempts++;

            }
            while (
                Math.hypot(
                    x - rect.left,
                    y - rect.top
                ) < 170 &&
                attempts < 10
            );


            return {
                x,
                y
            };

        }



        /* =================================
           MOVE NO BUTTON
        ================================= */

        function moveNoButton(event) {

            if (popupStarted) {
                return;
            }


            if (event) {
                event.preventDefault();
            }


            /*
             * Tránh chạy quá nhanh
             * gây giật trên điện thoại.
             */

            const now =
                Date.now();


            if (
                now - lastMoveTime <
                120
            ) {
                return;
            }


            lastMoveTime =
                now;


            const position =
                getSafeRandomPosition();


            noBtn.style.position =
                "fixed";

            noBtn.style.left =
                position.x + "px";

            noBtn.style.top =
                position.y + "px";

            noBtn.style.right =
                "auto";

            noBtn.style.bottom =
                "auto";

            noBtn.style.margin =
                "0";

            noBtn.style.visibility =
                "visible";

            noBtn.style.opacity =
                "1";

            noBtn.style.display =
                "block";

            noBtn.style.zIndex =
                "15000";


            const rotation =
                Math.random() > 0.5
                    ? 3
                    : -3;


            noBtn.style.transform =
                `rotate(${rotation}deg)`;

        }



        /* =================================
           DESKTOP:
           CHUỘT ĐẾN GẦN NÚT THÌ CHẠY
        ================================= */

        document.addEventListener(
            "mousemove",
            function (event) {

                if (
                    popupStarted ||
                    !window.matchMedia(
                        "(hover: hover) and (pointer: fine)"
                    ).matches
                ) {
                    return;
                }


                const rect =
                    noBtn.getBoundingClientRect();


                const centerX =
                    rect.left +
                    rect.width / 2;


                const centerY =
                    rect.top +
                    rect.height / 2;


                const distance =
                    Math.hypot(
                        event.clientX -
                        centerX,

                        event.clientY -
                        centerY
                    );


                /*
                 * Chuột cách khoảng
                 * 90px thì nút chạy.
                 */

                if (distance < 90) {

                    moveNoButton();

                }

            }
        );



        /* =================================
           CLICK / TOUCH / PEN
        ================================= */

        noBtn.addEventListener(
            "pointerdown",
            function (event) {

                event.preventDefault();

                moveNoButton(event);

            }
        );


        noBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                moveNoButton(event);

            }
        );



        /* =================================
           YES
        ================================= */

        yesBtn.addEventListener(
            "click",
            showSuccessModal
        );



        /* =================================
           SHOW POPUP
        ================================= */

        function showSuccessModal() {

            if (popupStarted) {
                return;
            }


            popupStarted = true;


            noBtn.style.display =
                "none";


            yesBtn.disabled =
                true;


            modalOverlay.style.display =
                "flex";


            /*
             * Restart progress animation
             */

            progressBar.style.animation =
                "none";


            void progressBar.offsetWidth;


            progressBar.style.animation =
                "countdownProgress 5s linear forwards";


            let seconds = 5;


            secondsElement.textContent =
                seconds;


            countdownInterval =
                setInterval(
                    function () {

                        seconds--;


                        if (seconds < 0) {
                            seconds = 0;
                        }


                        secondsElement.textContent =
                            seconds;


                        if (seconds <= 0) {

                            clearInterval(
                                countdownInterval
                            );

                        }

                    },
                    1000
                );


            redirectTimeout =
                setTimeout(
                    function () {

                        window.location.href =
                            "luachon.html";

                    },
                    5000
                );

        }



        /* =================================
           CLOSE POPUP
           vẫn chuyển trang sau 5 giây
        ================================= */

        closeModal.addEventListener(
            "click",
            function () {

                modalOverlay.style.display =
                    "none";

            }
        );



        /* =================================
           KEEP NO BUTTON INSIDE
        ================================= */

        function keepNoButtonInside() {

            if (
                noBtn.style.position !==
                "fixed"
            ) {
                return;
            }


            const viewport =
                getViewport();

            const rect =
                noBtn.getBoundingClientRect();

            const edge = 24;


            let x =
                rect.left;

            let y =
                rect.top;


            if (
                rect.left <
                edge
            ) {

                x = edge;

            }


            if (
                rect.top <
                edge
            ) {

                y = edge;

            }


            if (
                rect.right >
                viewport.width -
                edge
            ) {

                x =
                    viewport.width -
                    rect.width -
                    edge;

            }


            if (
                rect.bottom >
                viewport.height -
                edge
            ) {

                y =
                    viewport.height -
                    rect.height -
                    edge;

            }


            noBtn.style.left =
                x + "px";

            noBtn.style.top =
                y + "px";

        }



        window.addEventListener(
            "resize",
            keepNoButtonInside
        );


        if (window.visualViewport) {

            window.visualViewport.addEventListener(
                "resize",
                keepNoButtonInside
            );

        }

    </script>

</body>
